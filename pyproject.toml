[project]
name = "mindos"
version = "0.1.0"
description = "Local-first commitment and context intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "alembic>=1.14.0",
    "google-genai>=1.0.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "cryptography>=43.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2.0",
    "deepagents>=0.3.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
]
embed = ["sentence-transformers>=3.0.0"]
llm = [
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "google-genai>=1.0.0",
]
voice = ["moonshine-voice>=0.1.6"]


[project.scripts]
mindos = "cli.main:main"
backend-worker = "backend.worker.__main__:main"
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "cli*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "cli", "tests"]
