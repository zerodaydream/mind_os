[project]
name = "mindos"
version = "0.1.0"
description = "MindOS: a terminal-native personal operations environment."
readme = "docs/README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  "sqlalchemy>=2.0",
  "typer>=0.15",
  "rich>=13.9",
  "textual>=8.2",
  "langchain-core>=1.8",
  "langchain-google-genai>=4.5",
  "langgraph-checkpoint-postgres>=3.2",
  "langchain>=1.5",
  "langgraph>=1.2",
  "keyring>=25.7.0",
  "httpx>=0.28.1",
  "deepagents==0.7.41",
]

[project.scripts]
mindos = "mindos.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "hypothesis>=6.170.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a local PostgreSQL (docker compose up -d db)",
  "live: calls a real model provider (set MINDOS_TEST_LIVE=1)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL", "TID"]
ignore = ["PLR2004", "PLR0913", "RUF012", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "B"]
"src/mindos/persistence/migrations/**" = ["E501"]
"src/mindos/presentation/render.py" = ["PLR0911"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["alembic.*", "langchain_google_genai.*", "langgraph.*"]
ignore_missing_imports = true

# ---- Architecture contracts (ARCHITECTURE section 2.3). CI fails on violation. ----
[tool.importlinter]
root_package = "mindos"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure: imports nothing internal"
type = "forbidden"
source_modules = ["mindos.domain"]
forbidden_modules = [
  "mindos.application", "mindos.agents", "mindos.tools", "mindos.integrations",
  "mindos.persistence", "mindos.infra", "mindos.presentation", "mindos.bootstrap",
  "mindos.sandbox", "mindos.workers",
]

[[tool.importlinter.contracts]]
name = "domain has no provider, DB, or framework imports"
type = "forbidden"
source_modules = ["mindos.domain"]
forbidden_modules = [
  "googleapiclient", "google", "msal", "httpx", "requests", "psycopg", "psycopg_pool",
  "sqlalchemy", "alembic", "langchain", "langchain_core", "langchain_google_genai",
  "langgraph", "deepagents", "structlog", "textual", "typer", "rich", "keyring",
]

[[tool.importlinter.contracts]]
name = "adapters are reachable only from bootstrap"
type = "forbidden"
source_modules = [
  "mindos.domain", "mindos.application", "mindos.agents", "mindos.tools",
  "mindos.persistence", "mindos.infra", "mindos.presentation",
  "mindos.sandbox", "mindos.workers",
]
forbidden_modules = ["mindos.integrations"]

[[tool.importlinter.contracts]]
name = "presentation renders events; no business or provider code"
type = "forbidden"
source_modules = ["mindos.presentation"]
forbidden_modules = [
  "mindos.agents", "mindos.tools", "mindos.integrations",
  "mindos.persistence", "mindos.infra",
]

[[tool.importlinter.contracts]]
name = "application depends on domain only"
type = "forbidden"
source_modules = ["mindos.application"]
forbidden_modules = [
  "mindos.agents", "mindos.tools", "mindos.integrations", "mindos.persistence",
  "mindos.infra", "mindos.presentation", "mindos.bootstrap",
]

[[tool.importlinter.contracts]]
name = "agents depend on domain, tools, and application ports"
type = "forbidden"
source_modules = ["mindos.agents"]
forbidden_modules = [
  "mindos.integrations", "mindos.persistence", "mindos.infra",
  "mindos.presentation", "mindos.bootstrap",
]

[[tool.importlinter.contracts]]
name = "tools depend on the domain only"
type = "forbidden"
source_modules = ["mindos.tools"]
forbidden_modules = [
  "mindos.agents", "mindos.application", "mindos.integrations", "mindos.persistence",
  "mindos.infra", "mindos.presentation", "mindos.bootstrap", "mindos.sandbox",
  "mindos.workers",
]

[[tool.importlinter.contracts]]
name = "tools are framework-free"
type = "forbidden"
source_modules = ["mindos.tools"]
forbidden_modules = ["langchain", "langchain_core", "langgraph", "langchain_google_genai"]

[[tool.importlinter.contracts]]
name = "persistence and integrations are independent"
type = "independence"
modules = ["mindos.persistence", "mindos.integrations"]
